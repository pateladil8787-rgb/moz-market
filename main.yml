name: Build MOZ MARKET APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android .
          cp main.dart lib/main.dart
          cp google-services.json android/app/google-services.json

      - name: Configure Android Package
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'namespace = "com.example.moz_market"',
              'namespace = "com.mozmarket.app"'
          )

          s = s.replace(
              'applicationId = "com.example.moz_market"',
              'applicationId = "com.mozmarket.app"'
          )

          p.write_text(s)
          PY

      - name: Configure Google Services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/settings.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false',
              1
          )

          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'plugins {',
              'plugins {\n    id("com.google.gms.google-services")',
              1
          )

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moz-market-v3-apk
          path: build/app/outputs/flutter-apk/app-release.apk
